apiVersion: apps/v1
kind: Deployment
metadata:
  name: pembayaran-service
  labels:
    app: pembayaran-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pembayaran-service
  template:
    metadata:
      labels:
        app: pembayaran-service
    spec:
      containers:
        - name: pembayaran-service
          image: ghcr.io/advprog-2026-a18-project/manajemen-pembayaran:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: PEMBAYARAN_DB_URL
              valueFrom:
                secretKeyRef:
                  name: pembayaran-db-secret
                  key: url
            - name: PEMBAYARAN_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pembayaran-db-secret
                  key: username
            - name: PEMBAYARAN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pembayaran-db-secret
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pembayaran-jwt-secret
                  key: secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
